<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PGC picks reminder</title>
  </head>
  <body style="margin: 0; background: #f1f5f9; padding: 24px 12px">
    <div style="display: none; max-height: 0; overflow: hidden; opacity: 0">
      Your {{ params.tournamentName }} team is waiting.
    </div>
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 560px;
              border: 1px solid #e2e8f0;
              border-radius: 16px;
              background: #ffffff;
            "
          >
            <tr>
              <td
                style="
                  padding: 28px;
                  font-family: Arial, Helvetica, sans-serif;
                  color: #0f172a;
                "
              >
                <p style="margin: 0 0 10px; font-size: 22px; font-weight: 700">
                  Quick picks reminder
                </p>
                <p style="margin: 0 0 22px; font-size: 16px; line-height: 1.5">
                  Your team for {{ params.tournamentName }} is still waiting.
                  Make your picks before the tournament starts.
                </p>
                <a
                  href="{{ params.nextUpUrl }}"
                  style="
                    display: inline-block;
                    border-radius: 8px;
                    background: #166534;
                    padding: 12px 18px;
                    color: #ffffff;
                    font-size: 15px;
                    font-weight: 700;
                    text-decoration: none;
                  "
                >
                  Make my picks
                </a>
                <p style="margin: 22px 0 0; font-size: 14px; color: #64748b">
                  See you on the leaderboard!<br />PGC Tour
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

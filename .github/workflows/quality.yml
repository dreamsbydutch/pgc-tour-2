name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node 22.23.1
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Convex types
        run: npx convex codegen
      - name: Verify generated Convex types
        run: git diff --exit-code -- convex/_generated
      - name: 1. Formatting check
        run: npm run format:check
      - name: 2. Strict lint
        run: npm run lint:strict
      - name: 3. Type check
        run: npm run typecheck
      - name: 4. Unit and integration tests
        run: npm test
      - name: 5. Convex bounded-I/O check
        run: npm run convex:io-check
      - name: 6. Production build
        run: npm run build
      - name: Produce bundle analysis
        run: npm run bundle:analyze
      - name: Upload bundle analysis
        uses: actions/upload-artifact@v6
        with:
          name: bundle-analysis
          path: artifacts/bundle-analysis.json
          if-no-files-found: error
      - name: 7. Bundle budgets
        run: npm run bundle:budget

  security:
    name: 8a. Dependency security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Use Node 22.23.1
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm run security:dependencies
      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  secret-scan:
    name: 8c. Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks binary
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
      - name: Scan current code and full Git history
        run: >-
          /tmp/gitleaks git .
          --log-opts="--all"
          --max-archive-depth=1
          --max-decode-depth=2
          --redact
          --no-banner
          --no-color
          --verbose
